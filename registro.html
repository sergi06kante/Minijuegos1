<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Crear cuenta | MiniJuegos</title>
		<link rel="stylesheet" href="css/estilos.css" />
	</head>
	<body class="registro-pagina">
		<header class="registro-header">
			<h1>MiniJuegos</h1>
		</header>

		<main>
            <center>
			<section aria-labelledby="titulo-registro">
				<h2 id="titulo-registro">Crear cuenta</h2>
				<form>
					<label for="nombre">Nombre de usuario</label>
					<input id="nombre" name="nombre" type="text" autocomplete="username" required />

					<label for="correo">Correo electrónico</label>
					<input id="correo" name="correo" type="email" autocomplete="email" required />

					<label for="contrasena">Contraseña</label>
					<input id="contrasena" name="contrasena" type="password" autocomplete="new-password" required />

					<button class="btn" type="submit">Registrarse</button>
				</form>
				<p><a href="index.html">Volver al inicio</a></p>
			</section>
            </center>
		</main>
	</body>
</html>
